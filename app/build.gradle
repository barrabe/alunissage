plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.barrabe.alunissage'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.barrabe.alunissage'
        minSdk 26
        targetSdk 34
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger())
        versionName "1.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }

    // Clé de signature fixe, versionnée avec le projet : chaque nouvelle
    // compilation peut s'installer par-dessus la précédente.
    signingConfigs {
        fixe {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixe
        }
        debug {
            signingConfig signingConfigs.fixe
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
